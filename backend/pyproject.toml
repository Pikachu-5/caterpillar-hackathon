[project]
name = "cat-operator-backend"
version = "0.0.0"
description = "Scaffold only; FastAPI implementation is not present"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1", "httpx>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
[tool.uv]
package = false
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
