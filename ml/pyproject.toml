[project]
name = "cat-operator-ml"
version = "0.1.0"
description = "Synthetic data generation and ML models for the CAT operator hub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
]
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
[tool.uv]
package = false
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

